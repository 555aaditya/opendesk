name: Neon cleanup

# Deletes the PR's Neon branch (created by ci.yml) when the PR closes, merged
# or not. pull_request_target would expose secrets to fork code; plain
# pull_request is enough because this job checks out nothing.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-branch:
    name: Delete Neon branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        continue-on-error: true # the PR may never have changed migrations, so no branch exists
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0A0A0A;overflow:hidden}
  .card{box-sizing:border-box;width:1200px;height:630px;padding:80px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-family:Geist,sans-serif}
  .logo img{height:44px;display:block}
  h1{font-weight:600;font-size:84px;letter-spacing:-0.04em;line-height:1.02;margin:0 0 20px}
  p{font-size:28px;color:#8A8A8A;margin:0 0 28px}
  code{font-family:"Geist Mono",monospace;font-size:24px;color:#E4E4E4}
</style></head>
<body><div class="card">
  <div class="logo"><img src="../logo/lockup-white.svg" alt="opendesk"></div>
  <div><h1>The open-source helpdesk.</h1><p>Self-host it, own your data, run support in the open.</p><code>opendesk.sh</code></div>
</div></body></html>
